server:
  port: 8080

spring:
  application:
    name: recycle-backend
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
      continue-on-error: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.recycle: debug

# JWT：secret 至少 32 字节，生产环境用环境变量 JWT_SECRET 覆盖
# access token 短（30 分钟），refresh token 长（7 天，存库可撤销）
app:
  upload:
    dir: uploads        # 相对后端工作目录；换成 OSS 时改 FileService 实现即可
  jwt:
    secret: ${JWT_SECRET:recycle-mvp-dev-secret-key-please-change-in-production-2026}
    access-expire-seconds: 1800     # 30 分钟
    refresh-expire-seconds: 604800  # 7 天
